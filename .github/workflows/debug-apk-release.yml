name: Build Debug APK and Upload to GitHub Release

on:
    workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew
        working-directory: NewsFeed

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: NewsFeed

      - name: Upload Debug APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: manual-debug-${{ github.run_id }}
          name: Debug APK - Run ${{ github.run_id }}
          files: NewsFeed/app/build/outputs/apk/debug/app-debug.apk
        env:
          TOKEN: ${{ secrets.TOKEN }}